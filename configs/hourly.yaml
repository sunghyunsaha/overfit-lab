# 1-hour bars. Strategies are backtested on hourly bars and their returns are summed to
# daily, so every diagnostic still sees one daily T x N matrix. Indicator windows are in
# BARS, so the same grid means much shorter horizons here (5 to 250 hours).
# Hourly bars exist only in the Binance source: `make data-hourly`, then `make hourly`.
# Results go to reports/hourly/ and never touch the daily results. `make docs` then
# shows them in the hourly section of README.md and REPORT.md.
output_dir: reports/hourly
artifacts_dir: artifacts/hourly
render_docs: false
data:
  source: binance
  interval: 1h
